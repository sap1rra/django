{% extends 'base.html' %}

{% block title %} Блог {% endblock %}
{% block content %}

    <h1>Welcome to {{ title }}</h1>

        {% for post in posts %}
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
                <small>Created at: {{ post.created_at }}</small>
                <a href="{% url 'post_detail' post.id %}" class="btn btn-primary">Read Post</a>
        {% endfor %}

{% endblock %}
